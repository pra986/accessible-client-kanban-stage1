[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "accessible-client-kanban-stage1"
version = "0.1.0"
description = "Stage-1 client-side Kanban state reducer enforcing the 5-column invariant, contiguous card indexing, keyboard/drag-and-drop moves, and stateless refresh semantics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
